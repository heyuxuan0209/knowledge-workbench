<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>上传岔口 · 流程 mock</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#efece4;--surface:#faf8f2;--brief-bg:#f4f6f9;--text:#211f1a;--body:#332f27;--body2:#4a463d;
  --sub:#706b60;--sub2:#8a8478;--faint:#b0a894;--line10:rgba(33,31,26,.1);--line08:rgba(33,31,26,.08);
  --line14:rgba(33,31,26,.14);--accent:#3d5a80;--accent-hover:#2c456a;--green:#3f7350;--amber:#a9791f;--red:#a24b3f;--serif:'Newsreader',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;padding:24px 0 80px}
.wrap{max-width:760px;margin:0 auto;padding:0 24px}
h1{font-family:var(--serif);font-size:22px;font-weight:600}
.sub{font-size:12.5px;color:var(--sub2);margin:3px 0 22px}
.stage{border:1px solid var(--line10);border-radius:14px;background:var(--surface);padding:18px;min-height:230px}
.step-lab{font-size:11px;font-weight:700;color:var(--sub2);letter-spacing:.03em;margin-bottom:12px}

.drop{border:1.5px dashed var(--line14);border-radius:11px;padding:26px;text-align:center;cursor:pointer;color:var(--sub2)}
.drop:hover{border-color:var(--accent);color:var(--accent);background:rgba(61,90,128,.03)}
.drop .ic{font-size:30px}
.drop .t{font-size:13.5px;font-weight:600;margin-top:8px}
.drop .h{font-size:11.5px;color:var(--faint);margin-top:5px}
.chips{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.chip{font-size:11px;color:var(--sub);border:1px solid var(--line10);border-radius:20px;padding:3px 10px;cursor:pointer;background:var(--surface)}
.chip:hover{border-color:var(--accent);color:var(--accent)}

.extract{text-align:center;padding:30px 10px}
.bar{height:5px;background:var(--line08);border-radius:3px;overflow:hidden;margin:16px auto;max-width:280px}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width 1s ease}
.fname{font-size:13px;font-weight:600}
.fmeta{font-size:11.5px;color:var(--sub2);margin-top:4px}

/* fork */
.fork-head{font-size:13px;color:var(--sub);margin-bottom:14px}
.fork-head b{color:var(--body)}
.fork-head .cnt{color:var(--accent);font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.opts{grid-template-columns:1fr}}
.opt{border:1px solid var(--line10);border-radius:11px;padding:15px 14px;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--accent);background:rgba(61,90,128,.04)}
.opt.primary{border-color:rgba(61,90,128,.4)}
.opt .ic{font-size:24px}
.opt .nm{font-size:14px;font-weight:600;margin-top:8px}
.opt.primary .nm{color:var(--accent)}
.opt .ds{font-size:12px;color:var(--sub2);line-height:1.55;margin-top:5px}
.opt .badge{font-size:10px;color:var(--green);font-weight:700;margin-left:6px;vertical-align:1px}

/* result */
.res{padding:6px 2px}
.res .ok{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--green)}
.res .desc{font-size:12.5px;color:var(--sub);line-height:1.6;margin-top:10px}
.editor{border:1px solid var(--line10);border-radius:10px;background:var(--brief-bg);margin-top:14px;overflow:hidden}
.ed-top{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line08);font-size:11.5px;color:var(--sub2)}
.ed-top .lab{background:rgba(61,90,128,.1);color:var(--accent);font-weight:700;font-size:10px;padding:2px 7px;border-radius:5px}
.ed-body{padding:12px;font-size:12.5px;color:var(--body2);line-height:1.7;white-space:pre-wrap;max-height:150px;overflow:auto;background:var(--surface)}
.ed-tools{display:flex;gap:7px;padding:10px 12px;border-top:1px solid var(--line08);flex-wrap:wrap}
.pilltool{font-size:11px;border:1px solid var(--line10);border-radius:7px;padding:4px 9px;color:var(--sub);background:var(--surface);cursor:pointer}
.pilltool:hover{border-color:var(--accent);color:var(--accent)}
.pilltool.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.note{font-size:11.5px;color:var(--sub2);line-height:1.6;background:var(--brief-bg);border-radius:8px;padding:10px 12px;margin-top:14px}
.note b{color:var(--accent)}
.back{font-size:11.5px;color:var(--accent);background:none;border:none;cursor:pointer;margin-top:16px;padding:0}

.entry{margin-top:26px;border:1px solid var(--line10);border-radius:11px;background:var(--surface);padding:14px}
.entry h3{font-size:12.5px;color:var(--sub2);margin-bottom:9px;font-weight:700}
.entry .r{display:flex;gap:8px}
.entry .b{flex:1;text-align:center;font-size:12px;font-weight:600;border:1px solid var(--line10);border-radius:8px;padding:9px;color:var(--sub);cursor:pointer;background:var(--surface)}
.entry .b:hover{border-color:var(--accent);color:var(--accent)}
.entry .h{font-size:11px;color:var(--faint);margin-top:9px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <h1>④ 上传岔口 · 走一遍</h1>
  <div class="sub">选文件 → 抽正文 → 二选一「当素材 / 当初稿」。点着试，看两个去向分别发生什么。</div>

  <div class="stage" id="stage"></div>

  <div class="entry">
    <h3>配套：创作台左栏也能上传（同样两个去向）</h3>
    <div class="r">
      <div class="b">＋ 新增（粘贴）</div>
      <div class="b">⬆ 上传文件</div>
    </div>
    <div class="h">支持 .md / .txt / .docx / 飞书导出。在创作台里也能随手把一份文档拉进来当初稿或素材。</div>
  </div>
</div>

<script>
var stage=document.getElementById('stage');
var SAMPLE='AI 产品的信息管道\n\n用户每天被信息淹没，真正的痛点不是信息少，是没有一条「替我筛 → 替我读 → 喂给我」的管道。\n\n第一层是筛：从上百个源里挑出今天真正值得看的十条……\n第二层是读：把长文压成一段能扫的要点……\n第三层是喂：按我的关注顺序推给我，而不是让我自己去翻。';

function step1(){
  stage.innerHTML=
    '<div class="step-lab">第 1 步 · 选文件</div>'+
    '<div class="drop" onclick="step2()">'+
      '<div class="ic">⬆</div>'+
      '<div class="t">拖入 / 点击上传文档</div>'+
      '<div class="h">.md / .txt / .docx / 飞书导出的文件</div>'+
      '<div class="chips">'+
        '<span class="chip" onclick="event.stopPropagation();step2()">📄 产品周报.md</span>'+
        '<span class="chip" onclick="event.stopPropagation();step2()">🅕 飞书文档.docx</span>'+
      '</div>'+
    '</div>';
}
function step2(){
  stage.innerHTML=
    '<div class="step-lab">第 2 步 · 抽取正文</div>'+
    '<div class="extract">'+
      '<div class="fname">📄 产品周报.md</div>'+
      '<div class="fmeta">正在抽取正文…</div>'+
      '<div class="bar"><i id="pb"></i></div>'+
    '</div>';
  setTimeout(function(){document.getElementById('pb').style.width='100%'},60);
  setTimeout(step3,1050);
}
function step3(){
  stage.innerHTML=
    '<div class="step-lab">第 3 步 · 拿它来做什么</div>'+
    '<div class="fork-head">已从 <b>产品周报.md</b> 抽出正文 <span class="cnt">2,140 字</span> —— 拿它来做什么？</div>'+
    '<div class="opts">'+
      '<div class="opt" onclick="resNote()">'+
        '<div class="ic">📚</div>'+
        '<div class="nm">入库当素材</div>'+
        '<div class="ds">存进素材库，之后在创作台勾选、被引用溯源。＝现在的行为。</div>'+
      '</div>'+
      '<div class="opt primary" onclick="resDraft()">'+
        '<div class="ic">✍️</div>'+
        '<div class="nm">作为我的初稿<span class="badge">直接改</span></div>'+
        '<div class="ds">正文进创作台编辑器当初稿，选文体/平台就地改写你的原文。</div>'+
      '</div>'+
    '</div>';
}
function resNote(){
  stage.innerHTML=
    '<div class="step-lab">结果 · 去向 A</div>'+
    '<div class="res">'+
      '<div class="ok">✓ 已入库为素材</div>'+
      '<div class="desc">「产品周报.md」已存进<b>素材库</b>，系统抽了结构化摘录、留了来源。之后你在创作台左栏能勾选它、正文里引用会自动溯源到这条。<br>——它是<b>被引用的料</b>，不是你直接动笔的稿。</div>'+
    '</div>'+
    '<button class="back" onclick="step3()">← 换一个去向</button>';
}
function resDraft(){
  stage.innerHTML=
    '<div class="step-lab">结果 · 去向 B（进了创作台）</div>'+
    '<div class="res">'+
      '<div class="ok">✓ 已作为初稿进创作台</div>'+
      '<div class="editor">'+
        '<div class="ed-top"><span class="lab">初稿 · 来自 产品周报.md</span><span>2,140 字 · 你的原文，未被 AI 重写</span></div>'+
        '<div class="ed-body">'+SAMPLE.replace(/</g,'&lt;')+'</div>'+
        '<div class="ed-tools">'+
          '<span style="font-size:11px;color:var(--faint);align-self:center">在创作台选文体/平台，再对你的原文动手：</span>'+
          '<span class="pilltool on">换文体 ▾</span>'+
          '<span class="pilltool">换平台 ▾</span>'+
          '<span class="pilltool">润色</span>'+
          '<span class="pilltool">按平台改写</span>'+
        '</div>'+
      '</div>'+
      '<div class="note"><b>关键</b>：正文<b>原样进编辑器</b>让你手改，AI 只是旁边可点的工具（润色/改写），<b>不会先替你重写一版</b>——改的始终是你的原文。文体/平台仍在创作台选。</div>'+
    '</div>'+
    '<button class="back" onclick="step3()">← 换一个去向</button>';
}
step1();
</script>
</body>
</html>
