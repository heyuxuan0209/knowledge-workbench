<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>X 英文视频 demo · 标题卡与画面处理选型（6 版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tektur:wght@600;800&family=JetBrains+Mono:wght@500;700&family=Noto+Serif+SC:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#16181d;color:#e8e8ea;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding:28px 32px 80px}
h1{font-size:20px;font-weight:700;margin-bottom:6px}
.lede{color:#9aa0a8;font-size:13px;line-height:1.7;margin-bottom:20px;max-width:900px}
.lede b{color:#e8e8ea}
.tabs{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;background:#16181d;padding:12px 0;z-index:9;border-bottom:1px solid #2a2d34;margin-bottom:22px}
.tab{padding:8px 14px;border:1px solid #343841;border-radius:999px;background:#1d2026;color:#c6cad1;
  font-size:13px;cursor:pointer;transition:.15s}
.tab:hover{border-color:#5a6070}
.tab.on{background:#e8e8ea;color:#16181d;border-color:#e8e8ea;font-weight:600}
.sec{display:none}
.sec.on{display:block}
.meta{display:flex;gap:24px;flex-wrap:wrap;align-items:baseline;margin-bottom:14px}
.meta .nm{font-size:17px;font-weight:700}
.meta .src{font-size:12px;color:#8a9098}
.sw{display:flex;gap:6px;align-items:center}
.sw i{width:16px;height:16px;border-radius:4px;display:block;border:1px solid #ffffff22}
.verdict{font-size:12.5px;color:#9aa0a8;line-height:1.65;margin-bottom:16px;max-width:980px}
.verdict .good{color:#7ee0a8}.verdict .bad{color:#f08c8c}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;max-width:1500px}
.cell{}
.cap{font-size:11.5px;color:#7d838c;margin-bottom:6px;letter-spacing:.04em}
.fr{aspect-ratio:1920/1246;width:100%;overflow:hidden;position:relative;display:flex;
  flex-direction:column;justify-content:center;border-radius:4px}

/* ---------- 通用卡片骨架 ---------- */
.eyebrow{font-size:1.5cqw;letter-spacing:.18em;text-transform:uppercase;font-weight:600}
.ttl{line-height:1.16;font-weight:800}
.sub{line-height:1.75}
.brand{position:absolute;font-size:1.15cqw;letter-spacing:.1em}
.fr{container-type:inline-size}
.pad{padding:0 8.5%}
.badge{position:absolute;left:50%;transform:translateX(-50%);bottom:7%;
  font-size:1.35cqw;padding:.9cqw 1.6cqw;white-space:nowrap;display:flex;align-items:center;gap:.7cqw}
.shotimg{width:100%;height:100%;object-fit:cover;display:block}
.shotwrap{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:87.5%}

/* =========== 0 现状（对照） =========== */
[data-t="now"] .fr{background:#0D0F14;color:#F5F6FA;text-align:center}
[data-t="now"] .ttl{font-size:6.9cqw}
[data-t="now"] .sub{font-size:3.5cqw;color:#969CAA;margin-top:2.2cqw}
[data-t="now"] .pill{display:inline-block;border:2px solid #7C6AF7;background:#1E1A3C;color:#7C6AF7;
  border-radius:999px;padding:1.4cqw 2.6cqw;font-size:3.4cqw;margin-bottom:4cqw}
[data-t="now"] .badge{background:#0D0F14E6;border:2px solid #7C6AF7;border-radius:16px;color:#fff}
[data-t="now"] .brand{display:none}

/* =========== 1 B 黑金 =========== */
[data-t="gold"] .fr{background:#08080a;color:#f2f0ec;text-align:left;
  background-image:radial-gradient(70% 55% at 50% -10%,#e8b56714,transparent 70%),
                   radial-gradient(50% 40% at 100% 100%,#e8b5670d,transparent 70%)}
[data-t="gold"] .eyebrow{color:#e8b567;font-family:'JetBrains Mono',ui-monospace,monospace;
  display:flex;align-items:center;gap:1.4cqw;font-size:1.55cqw;margin-bottom:3cqw}
[data-t="gold"] .eyebrow::before{content:"";width:4.5cqw;height:1px;background:#e8b567;opacity:.65}
[data-t="gold"] .ttl{font-size:6.6cqw;letter-spacing:-.02em}
[data-t="gold"] .ttl em{font-style:normal;color:#e8b567}
[data-t="gold"] .sub{font-size:2.55cqw;color:#a5a29c;margin-top:2.6cqw}
[data-t="gold"] .sub.s2{color:#6f6c67;margin-top:1cqw}
[data-t="gold"] .rule{height:1px;background:#ffffff17;margin:3.4cqw 0 0}
[data-t="gold"] .brand{right:8.5%;bottom:5.5%;color:#b98a3d;font-family:'JetBrains Mono',monospace}
[data-t="gold"] .fr .shotwrap{outline:1px solid #ffffff1f;outline-offset:-1px}
[data-t="gold"] .badge{background:#08080aE8;border:1px solid #e8b56747;border-radius:999px;color:#f3d5a0;
  font-family:'JetBrains Mono',monospace}

/* =========== 2 I 8-Bit Orbit =========== */
[data-t="orbit"] .fr{background:#0A0E27;color:#fff;text-align:center;
  background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);
  background-size:4cqw 4cqw}
[data-t="orbit"] .eyebrow{color:#5EDCF4;font-family:'JetBrains Mono',monospace;font-size:1.7cqw;margin-bottom:3cqw}
[data-t="orbit"] .ttl{font-size:6.4cqw;font-family:'Tektur',-apple-system,"PingFang SC",sans-serif;
  color:#fff;text-shadow:.28cqw .28cqw 0 #F0A6CA}
[data-t="orbit"] .ttl em{font-style:normal;color:#F4D03F}
[data-t="orbit"] .sub{font-size:2.55cqw;color:#E2D5F2;margin-top:3cqw}
[data-t="orbit"] .sub.s2{color:#8f86a8;margin-top:1cqw}
[data-t="orbit"] .brand{right:6%;bottom:5.5%;color:#5EDCF4;font-family:'JetBrains Mono',monospace;opacity:.7}
[data-t="orbit"] .fr .shotwrap{outline:2px solid #5EDCF4;outline-offset:-2px}
[data-t="orbit"] .badge{background:#0A0E27F0;border:2px solid #5EDCF4;border-radius:0;color:#fff;
  font-family:'JetBrains Mono',monospace;box-shadow:.4cqw .4cqw 0 #F0A6CA}
[data-t="orbit"] .dots{position:absolute;left:6%;top:12%;display:flex;gap:.8cqw}
[data-t="orbit"] .dots i{width:1.2cqw;height:1.2cqw;display:block}

/* =========== 3 H Raw Grid（深色变体） =========== */
[data-t="raw"] .fr{background:#0A0A0A;color:#fff;text-align:left}
[data-t="raw"] .eyebrow{display:inline-block;background:#F2D4CF;color:#0A0A0A;border:3px solid #fff;
  box-shadow:.8cqw .8cqw 0 #fff;padding:.8cqw 1.6cqw;font-size:1.7cqw;margin-bottom:4cqw;font-weight:700}
[data-t="raw"] .ttl{font-size:6.8cqw;letter-spacing:-.01em}
[data-t="raw"] .ttl em{font-style:normal;background:#E5EDD6;color:#0A0A0A;padding:0 .6cqw}
[data-t="raw"] .sub{font-size:2.5cqw;color:#c9c9c9;margin-top:3cqw;border-left:3px solid #F2D4CF;padding-left:1.6cqw}
[data-t="raw"] .sub.s2{color:#8c8c8c;margin-top:1.2cqw;border-left-color:#E5EDD6}
[data-t="raw"] .brand{right:8.5%;bottom:5.5%;color:#6a6a6a;font-weight:700}
[data-t="raw"] .fr .shotwrap{outline:3px solid #fff;outline-offset:-3px}
[data-t="raw"] .badge{background:#F2D4CF;border:3px solid #fff;border-radius:0;color:#0A0A0A;font-weight:700;
  box-shadow:.6cqw .6cqw 0 #fff}

/* =========== 4 Q Neo-Grid Bold（浅色） =========== */
[data-t="neo"] .fr{background:#F5F4EF;color:#0A0A0A;text-align:left;
  background-image:linear-gradient(#0a0a0a0a 1px,transparent 1px),linear-gradient(90deg,#0a0a0a0a 1px,transparent 1px);
  background-size:5cqw 5cqw}
[data-t="neo"] .eyebrow{font-family:'JetBrains Mono',monospace;color:#0A0A0A;font-size:1.6cqw;margin-bottom:2.4cqw}
[data-t="neo"] .ttl{font-size:6.8cqw;letter-spacing:-.02em}
[data-t="neo"] .ttl em{font-style:normal;background:#E6FF3D;padding:0 .5cqw}
[data-t="neo"] .sub{font-size:2.5cqw;color:#5c5c58;margin-top:2.6cqw}
[data-t="neo"] .sub.s2{color:#8A8A85;margin-top:1cqw}
[data-t="neo"] .hr{height:3px;background:#0A0A0A;margin-bottom:2.6cqw;width:16cqw}
[data-t="neo"] .brand{right:8.5%;bottom:5.5%;color:#8A8A85;font-family:'JetBrains Mono',monospace}
[data-t="neo"] .fr .shotwrap{outline:3px solid #0A0A0A;outline-offset:-3px}
[data-t="neo"] .badge{background:#E6FF3D;border:3px solid #0A0A0A;border-radius:0;color:#0A0A0A;font-weight:700}

/* =========== 5 R Editorial Forest =========== */
[data-t="forest"] .fr{background:#2e4a2a;color:#efe7d4;text-align:center;
  font-family:'Noto Serif SC',"Songti SC",serif}
[data-t="forest"] .eyebrow{color:#e89cb1;font-family:'JetBrains Mono',monospace;font-size:1.55cqw;margin-bottom:2.6cqw}
[data-t="forest"] .ttl{font-size:6.5cqw;font-weight:800}
[data-t="forest"] .ttl em{font-style:normal;color:#e89cb1}
[data-t="forest"] .sub{font-size:2.5cqw;color:#c9c0a8;margin-top:2.6cqw}
[data-t="forest"] .sub.s2{color:#9d9781;margin-top:1cqw}
[data-t="forest"] .rule{width:9cqw;height:2px;background:#e89cb1;margin:0 auto 3cqw}
[data-t="forest"] .brand{right:7%;bottom:5.5%;color:#8fa87f;font-family:'JetBrains Mono',monospace}
[data-t="forest"] .fr .shotwrap{outline:2px solid #efe7d433;outline-offset:-2px}
[data-t="forest"] .badge{background:#243a21F0;border:1px solid #e89cb1;border-radius:999px;color:#efe7d4}
</style>
</head>
<body>

<h1>X 英文视频 demo · 标题卡与画面处理选型</h1>
<p class="lede">
录屏本身改不了配色（那是真实界面），能设计的是三处：<b>标题卡</b>、<b>录屏画面的画框与留白底色</b>、<b>加速角标 / 常驻署名</b>。
下面 6 版用的是<b>同一套真实文案 + 同一张真实画面</b>，只换设计语言。配色取自 <code>prototype/html-ppt-mocks/</code> 已定稿的模板（ADR-086）。
点上面的标签切换 · 键盘 <b>1–6</b> 也行。
</p>

    verdict:'<span class="good">最抢眼。</span>深蓝底 + 霓虹青，在一片素白的时间线里刷屏效果最强，"AI / 极客"标签也贴。<span class="bad">实测缺陷：</span>Tektur <b>没有中文字形</b>，中文会回退到系统字，再叠硬投影就糊（上面「一键解读」就是实拍效果，我已把投影从 .45 调到 .28 做公平对比，仍不干净）。要用只能中文改用无投影的黑体、只让数字/英文用 Tektur。另：青+粉跟产品实际界面（中性深灰 + 紫）不是一个世界，看完记住的是卡片不是产品。'},
  { k:"raw", nm:"H · Raw Grid（深色变体）", src:"来源：H-RawGrid中文.html · 唯一工程化那套",

    verdict:'粗野主义：3px 白描边 + 硬投影 + 色块高亮。<span class="good">好处</span>是结构极清楚、缩到手机也不糊，和会议纪要那套是同一血统（品牌一致）。<span class="bad">风险：</span>白色 3px 描边压在深色录屏上有点抢，且原模板是浅底，这是我改的深色变体、不是定稿原样。'},
  { k:"neo", nm:"Q · Neo-Grid Bold（浅色）", src:"来源：Q-NeoGridBold中文.html · ADR-086 定稿",
    sw:["#F5F4EF","#0A0A0A","#E6FF3D","#8A8A85"],
    verdict:'纸白 + 荧光黄，信息层级最硬。<span class="bad">但对这条片子是错的：</span>录屏主体是黑的，浅色卡片一插就是<b>一次爆闪</b>——手机上连着看四次会难受。留给图文/长图，别用在这条视频。'},
  { k:"forest", nm:"R · Editorial Forest", src:"来源：R-EditorialForest中文.html · ADR-086 定稿",
    sw:["#2e4a2a","#efe7d4","#e89cb1","#243a21"],
    verdict:'墨绿 + 奶油衬线，杂志感、有人味，和"我在读一篇东西"的主题其实很搭。<span class="bad">风险：</span>衬线字号小了在手机上发虚；绿色跟产品界面完全无关，观感偏"内容号"而不是"开发者 demo"。'},

    verdict:'不难看，但<b>没有出处</b>——紫色是我随手挑的，不属于你任何一套已定稿模板，发出去不积累品牌资产。留作对照。'},
];

const CARD_HEAD = t => `
  <div class="fr pad">
    ${t==='orbit'?'<div class="dots"><i style="background:#5EDCF4"></i><i style="background:#F0A6CA"></i><i style="background:#F4D03F"></i></div>':''}
    ${t==='forest'?'<div class="rule"></div>':''}
    ${t==='neo'?'<div class="hr"></div>':''}
    ${t==='now'?'':`<div class="eyebrow">${t==='raw'?'读懂 / 一键解读':'DUDONG · X PLUGIN'}</div>`}
    <div class="ttl">一条 <em>45 分钟</em> 的英文视频，<br>你会点开吗？</div>
    <div class="sub">按我以前的规律：收藏，然后再也不打开</div>
    <div class="sub s2">「读懂」浏览器插件 × 知识工作台</div>
    <div class="brand">读懂 / DUDONG</div>
  </div>`;

const CARD_STEP = t => `
  <div class="fr pad">
    ${t==='now'?'<div style="text-align:center"><span class="pill">STEP 1</span></div>':`<div class="eyebrow">STEP 01</div>`}
    <div class="ttl">一键解读</div>
    <div class="sub">抓原帖 → 下视频音轨 → 转写 → 翻译 → 结构化摘要</div>
    <div class="sub s2">不用离开 X，不用下载，不用复制粘贴</div>
    <div class="brand">读懂 / DUDONG</div>
  </div>`;

const CARD_SHOT = (t,img) => `
  <div class="fr">
    <div class="shotwrap"><img class="shotimg" src="${img}"></div>
    <div class="badge">⏩ 45 分钟的视频，转写 + 翻译等 4 分钟 · 此处 60× 加速</div>
    <div class="brand">读懂 / DUDONG</div>
  </div>`;

const CARD_END = t => `
  <div class="fr pad">
    ${t==='forest'?'<div class="rule"></div>':''}
    ${t==='neo'?'<div class="hr"></div>':''}
    ${t==='now'?'':`<div class="eyebrow">THE POINT</div>`}
    <div class="ttl"><em>45 分钟</em> → <em>4 分钟</em></div>
    <div class="sub">解读 · 推飞书 · 追问 · 存灵感库，全程没离开原页面</div>
    <div class="sub s2">更关键的是——那 45 分钟，我本来根本不会花</div>
    <div class="brand">读懂 / DUDONG</div>
  </div>`;

const tabs = document.getElementById('tabs'), wrap = document.getElementById('wrap');
THEMES.forEach((th,i)=>{
  const b=document.createElement('div'); b.className='tab'+(i===0?' on':''); b.textContent=(i+1)+' · '+th.nm;
  b.onclick=()=>show(i); tabs.appendChild(b);
  const s=document.createElement('div'); s.className='sec'+(i===0?' on':''); s.dataset.t=th.k;
  s.innerHTML=`
    <div class="meta">
      <span class="nm">${th.nm}</span>
      <span class="src">${th.src}</span>
      <span class="sw">${th.sw.map(c=>`<i style="background:${c}"></i>`).join('')}${th.sw.map(c=>`<code style="font-size:11px;color:#8a9098">${c}</code>`).join(' ')}</span>
    </div>
    <div class="verdict">${th.verdict}</div>
    <div class="grid">
      <div class="cell"><div class="cap">① 片头卡</div>${CARD_HEAD(th.k)}</div>
      <div class="cell"><div class="cap">② STEP 卡（共 4 张）</div>${CARD_STEP(th.k)}</div>
      <div class="cell"><div class="cap">③ 录屏画面：画框 + 加速角标 + 常驻署名（深色场景）</div>${CARD_SHOT(th.k,SHOT_DARK)}</div>
      <div class="cell"><div class="cap">④ 录屏画面（浅色场景 · 知识工作台）</div>${CARD_SHOT(th.k,SHOT_LIGHT)}</div>
      <div class="cell" style="grid-column:1/-1"><div class="cap">⑤ 片尾卡</div>${CARD_END(th.k)}</div>
    </div>`;
  wrap.appendChild(s);
});
function show(i){
  [...tabs.children].forEach((b,j)=>b.classList.toggle('on',i===j));
  [...wrap.children].forEach((s,j)=>s.classList.toggle('on',i===j));
  location.hash = i+1;
  window.scrollTo({top:0,behavior:'smooth'});
}
addEventListener('keydown',e=>{const n=+e.key; if(n>=1&&n<=THEMES.length) show(n-1);});
{const h=+location.hash.slice(1); if(h>=1&&h<=THEMES.length) show(h-1);}
</script>
