*{box-sizing:border-box;margin:0;padding:0}
body{background:#16181d;color:#e8e8ea;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;padding:26px 32px 90px}
h1{font-size:19px;font-weight:700;margin-bottom:6px}

.note .good{color:#7ee0a8}.note .bad{color:#f08c8c}

.big{font-weight:800;letter-spacing:-.02em;line-height:1.08}

.dim{color:#a5a29c}.faint{color:#6f6c67}
.shot{width:100%;display:block;border-radius:1.6cqw;outline:1px solid #e8b56736;outline-offset:-1px}

if(!on){document.getElementById('tg').classList.remove('on');
        document.querySelectorAll('.guides').forEach(g=>g.classList.remove('on'));}
document.getElementById('tg').onclick=e=>{on=!on;e.target.classList.toggle('on',on);
  document.querySelectorAll('.guides').forEach(g=>g.classList.toggle('on',on));};
