<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>内容流程总览 · Knowledge Workbench</title>
<style>
:root{--paper:#f5f1e8;--ink:#252521;--muted:#716f67;--line:#25252120;--green:#54745f;--soft:#dbe5d8;--orange:#c96843}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(circle at 78% 5%,#dbe5d8cc,transparent 28%),var(--paper);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button{font:inherit}
.shell{display:grid;grid-template-columns:208px 1fr;min-height:100vh}aside{padding:28px 18px;border-right:1px solid var(--line);background:#faf8f2b8}.brand{margin:0 8px 34px;font:21px Georgia,serif}.brand small{display:block;margin-top:7px;color:var(--muted);font:11px sans-serif;letter-spacing:.08em}.nav{display:grid;gap:5px}.nav div{padding:10px 12px;border-radius:10px;color:#65635c;font-size:14px}.nav .active{margin-bottom:11px;background:var(--soft);color:#30483a;font-weight:700;border:1px solid #54745f35}.note{margin:30px 9px;color:#88857c;font-size:11px;line-height:1.7}
main{padding:52px clamp(32px,5vw,80px)}.eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.16em}h1{margin:14px 0 11px;font:44px/1.08 Georgia,"Songti SC",serif;letter-spacing:-1.6px}.lead{max-width:760px;color:var(--muted);font-size:16px;line-height:1.75}.rule{display:inline-block;margin-top:17px;padding:8px 12px;border:1px solid var(--line);border-radius:99px;font-size:12px;background:#ffffff70}.rule b{color:var(--orange)}
.flow{display:grid;grid-template-columns:repeat(7,minmax(118px,1fr));gap:10px;margin:40px 0 24px}.step{position:relative;min-height:154px;padding:16px 14px;text-align:left;border:1px solid var(--line);border-radius:16px;background:#fffdfa;color:var(--ink);cursor:pointer;transition:.18s}.step:not(:last-child):after{content:"→";position:absolute;right:-16px;top:65px;z-index:2;color:#aaa69d}.step:hover,.step.active{transform:translateY(-4px);border-color:var(--green);box-shadow:0 18px 45px #342d2218}.num{color:var(--orange);font:italic 12px Georgia}.step h2{margin:23px 0 8px;font-size:15px}.step p{margin:0;color:var(--muted);font-size:11.5px;line-height:1.5}.where{position:absolute;left:14px;bottom:12px;color:var(--green);font-size:10.5px;font-weight:700}
.detail{display:grid;grid-template-columns:1.05fr .95fr;border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 20px 50px #342d2215}.detail section{padding:28px 31px;background:#fffdfae8;min-height:260px}.detail section+section{border-left:1px solid var(--line)}.label{color:var(--orange);font-size:11px;font-weight:800;letter-spacing:.12em}.detail h3{margin:12px 0 9px;font:28px Georgia,"Songti SC",serif}.desc{margin:0;color:var(--muted);line-height:1.7}.jobs{display:grid;gap:9px;margin-top:20px}.job{font-size:13px}.job:before{content:"•";margin-right:10px;color:var(--green)}.action{display:flex;flex-direction:column;justify-content:space-between}.route{color:var(--muted);font-size:12px}.route strong{display:block;margin-top:6px;color:var(--ink);font-size:17px}.tip{margin-top:23px;padding:13px 14px;border-left:3px solid var(--orange);background:#c9684310;color:#635b54;font-size:12px;line-height:1.65}.cta{align-self:flex-start;padding:12px 17px;border:0;border-radius:12px;background:var(--ink);color:white;cursor:pointer;font-weight:700}.toast{position:fixed;left:50%;bottom:28px;translate:-50% 18px;opacity:0;padding:10px 16px;border-radius:99px;background:var(--ink);color:#fff;font-size:12px;transition:.2s}.toast.show{opacity:1;translate:-50% 0}
@media(max-width:1150px){.flow{grid-template-columns:repeat(4,1fr)}.step:after{display:none}}@media(max-width:760px){.shell{display:block}aside{display:none}main{padding:32px 18px}h1{font-size:35px}.flow{display:flex;overflow:auto;padding:5px 2px 14px}.step{min-width:155px}.detail{grid-template-columns:1fr}.detail section+section{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body><div class="shell"><aside><div class="brand">Knowledge Workbench<small>一个人的 AI 内容工作台</small></div><div class="nav"><div class="active">◎ 内容流程总览</div><div>◰ 资讯</div><div>▤ 素材</div><div>◇ 主题</div><div>◌ 灵感</div><div>✎ 创作</div><div>◫ 信源</div></div><div class="note">这是一张“地图”，不是新的任务中心。<br>看懂后，从任意一步进入现有页面。</div></aside><main><div class="eyebrow">START HERE · 新手导航</div><h1>一条内容，在这里怎么长出来</h1><div class="lead">从外部信息和你的一手经验出发，经过筛选、理解和判断，变成能发布的内容，再让真实数据回来帮助下一次决策。</div><div class="rule"><b>人</b>做观点、品味和判断 · <b>AI</b>做采集、整理、适配和反馈</div><div class="flow" id="flow"></div><div class="detail"><section><div class="label" id="label"></div><h3 id="title"></h3><p class="desc" id="desc"></p><div class="jobs" id="jobs"></div></section><section class="action"><div><div class="route">对应现有页面<strong id="route"></strong></div><div class="tip" id="tip"></div></div><button class="cta" id="cta">进入这一步 →</button></section></div></main></div><div class="toast" id="toast"></div>
<script>
const S=[
['发现信息','从稳定信源里找到值得看的少数内容。','资讯 · 信源','外面的信息太多，先把注意力留给真正重要的东西。',['多源采集与去重','今日必读与话题聚合','自定义关注的人和信源'],'新手可以先从“今日必读”开始，不需要先配齐所有信源。'],
['解读与筛选','读懂链接、视频和文档，判断是否值得留。','资讯 · 快速分析','AI 负责读、译、摘要，你决定哪些值得进入自己的知识体系。',['链接、视频、播客与文档解读','多篇素材一起追问','保留原文与来源证据'],'“读懂”不等于“值得写”，真正的取舍仍由你完成。'],
['沉淀素材','把外部资料和自己的经验放进同一个库。','素材','把自己的坑、经验和想法与外部信息一起收进来。',['一键存为素材','语义搜索找回旧内容','按主题归类与去重'],'最值钱的素材往往是你自己做事时留下的一手证据。'],
['形成主题与判断','让零散素材相互碰撞，长成可持续的认知。','主题 · 灵感','主题是一篇会随新证据持续更新的综述，不是标签文件夹。',['素材归入主题','综述、冲突观点与修订记录','从灵感升级为可写主题'],'这是人的主场：AI 可以摆出证据，核心主张必须是你真正相信的。'],
['创作母稿','带着真实素材和核心判断，写出一份干净深稿。','创作 · 定稿','先写清价值和结构，不在母稿阶段被平台格式带偏。',['从主题或多条素材起稿','段落级溯源与观点校验','在飞书文档中评审与定稿'],'母稿只解决“说什么”，不急着解决“在哪个平台怎么发”。'],
['多平台适配与发布','把同一个判断，变成各平台真正能发的形态。','创作 · 出片','按平台阅读方式重组、排版和生成视觉成品。',['公众号排版与头图','小红书/抖音图卡与口播稿','辅助送到平台后台，最后由人确认'],'不是把一篇文复制到所有平台：核心判断不变，表达形态随平台改变。'],
['数据回流与复盘','让发出去的内容带着真实结果回到下一轮。','数据复盘','对比同一内容在不同平台的表现，区分内容、表达、分发和取数口径。',['D3 / D7 / D30 数据回收','多平台横向对照','把复盘结论反馈给下一次选题'],'复盘不只找流量高的内容，而是找到哪种表达真正让读者有收获。']];
let a=0;const $=x=>document.getElementById(x);function draw(){flow.innerHTML=S.map((s,i)=>`<button class="step ${i===a?'active':''}" data-i="${i}"><span class="num">0${i+1}</span><h2>${s[0]}</h2><p>${s[1]}</p><span class="where">${s[2]}</span></button>`).join('');const s=S[a];label.textContent=`STEP 0${a+1}`;title.textContent=s[0];desc.textContent=s[3];jobs.innerHTML=s[4].map(x=>`<div class="job">${x}</div>`).join('');route.textContent=s[2];tip.textContent=s[5];document.querySelectorAll('.step').forEach(b=>b.onclick=()=>{a=+b.dataset.i;draw()})}cta.onclick=()=>{toast.textContent=`Mock：正式版将进入「${S[a][2]}」`;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1700)};draw();
</script></body></html>
