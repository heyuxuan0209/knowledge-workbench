<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>竖版分镜播放器</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&display=swap');
  /* ADR-046 P2a：竖版 9:16 分镜播放器（内容预览层，纯预览、零 TTS/零 API 花费）。
     配音是产品里另一步、用户单独触发才花钱（ADR-038 半自动：这里出播放器+分镜稿，剪映收尾）。
     主题（ADR-046 P3，用户选定 4 版）：暖刊/午夜霓虹(发布会)/Aesop药房/新粗野——皮肤按 .stage.th-* 覆写。 */
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--bg:#f2ede2;--ink:#2b2924;--sub:#6b6459;--accent:#c9784e;--line:rgba(43,41,36,.14);--panel:#faf8f2}
  body{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;background:#e9e4da;color:var(--ink);height:100vh;overflow:hidden}
  .wrap{display:flex;gap:20px;height:100vh;padding:18px 20px;align-items:stretch}
  /* 9:16 舞台，高度撑满、宽度按比例 */
  .stagebox{height:100%;aspect-ratio:9/16;flex:none;border-radius:22px;overflow:hidden;box-shadow:0 14px 40px rgba(33,31,26,.22);position:relative;background:var(--bg)}
  .stage{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:9% 8%;text-align:center;transition:background .4s}
  .kicker{font-size:2.4vh;letter-spacing:.14em;color:var(--accent);font-weight:700;text-transform:uppercase;margin-bottom:3vh;opacity:0}
  .kw{font-size:8.4vh;font-weight:800;line-height:1.12;color:var(--ink);opacity:0}
  .kw .hl{color:var(--accent)}
  .sub{font-size:3.1vh;color:var(--sub);margin-top:3.4vh;line-height:1.5;opacity:0}
  /* 烧进画面的字幕（抖音静音刷） */
  .captrack{position:absolute;left:6%;right:6%;bottom:8%;display:flex;justify-content:center}
  .capline{font-size:3.4vh;font-weight:600;line-height:1.5;color:var(--ink);background:rgba(255,255,255,.66);backdrop-filter:blur(3px);border-radius:14px;padding:1.4vh 2.6vh;max-width:100%;opacity:0}
  .badge{position:absolute;top:3.2%;left:5%;font-size:2vh;color:var(--accent);background:rgba(0,0,0,.05);border-radius:8px;padding:.5vh 1.4vh;font-weight:700;opacity:.9}
  .brand{position:absolute;bottom:3%;right:5%;font-size:2vh;color:var(--sub);opacity:.75}
  /* ===== 4 主题皮肤（.stage.th-*；只覆写颜色/字体/装饰，布局不变） ===== */
  /* 1 暖刊：奶油底 + 赭石 + 衬线 */
  .stage.th-warm{background:#f2ece0}
  .th-warm .kicker{color:#b06a3c}
  .th-warm .kw{color:#2c2820;font-family:'Newsreader',"Songti SC",serif;font-weight:700}
  .th-warm .sub{color:#7a7264}
  .th-warm .capline{background:rgba(255,255,255,.72);color:#3a352c}
  .th-warm .badge{color:#b06a3c;background:rgba(0,0,0,.05)}
  .th-warm .brand{color:#9a9488}
  /* 2 午夜霓虹（发布会大屏）：蓝紫电光 + 辉光 + 玻璃字幕 */
  .stage.th-neon{background:radial-gradient(130% 80% at 50% -8%,#1a1f3a 0%,#0a0b12 62%)}
  .th-neon .kicker{color:#8ea2ff;letter-spacing:.3em}
  .th-neon .kw{color:#eef1fb;font-weight:900;text-shadow:0 0 26px rgba(142,162,255,.34)}
  .th-neon .sub{color:#aab2ce}
  .th-neon .capline{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);color:#eef1fb}
  .th-neon .badge{color:#8ea2ff;background:rgba(255,255,255,.07)}
  .th-neon .brand{color:#7078a0}
  /* 3 Aesop 药房：米灰 + 橄榄绿（搬自图卡工具风格） */
  .stage.th-aesop{background:#E7E2D8}
  .th-aesop .kicker{color:#5A6247}
  .th-aesop .kw{color:#1B1A17;font-weight:700}
  .th-aesop .sub{color:#6B6459}
  .th-aesop .capline{background:rgba(255,255,255,.6);color:#3d3a33}
  .th-aesop .badge{color:#5A6247;background:rgba(0,0,0,.05)}
  .th-aesop .brand{color:#8a8478}
  /* 4 新粗野：荧光绿块 + 黑硬边字幕（搬自图卡工具风格） */
  .stage.th-brut{background:#FFFDF5}
  .th-brut .kicker{background:#0A0A0A;color:#C7F000;padding:.6vh 1.6vh;letter-spacing:.06em;border-radius:0}
  .th-brut .kw{color:#0A0A0A;font-weight:900;background:#C7F000;padding:.5vh 1.6vh;line-height:1.34}
  .th-brut .sub{color:#0A0A0A;font-weight:600}
  .th-brut .capline{background:#fff;color:#0A0A0A;border:3px solid #0A0A0A;border-radius:0;box-shadow:6px 6px 0 #0A0A0A;backdrop-filter:none;font-weight:600}
  .th-brut .badge{color:#0A0A0A;background:#C7F000;border-radius:0}
  .th-brut .brand{color:#0A0A0A;opacity:.55}
  .rv-in{animation:rvin .5s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes rvin{from{opacity:0;transform:translateY(2.2vh)}to{opacity:1;transform:none}}
  .progress{position:absolute;top:0;left:0;height:4px;background:var(--accent);width:0;transition:width .12s linear}
  /* 右侧控制列 */
  .panel{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;overflow:auto}
  .panel h2{font-size:16px;font-weight:700;margin-bottom:3px}
  .panel .hint{font-size:12px;color:var(--sub);line-height:1.55;margin-bottom:14px}
  .ctl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .lbl{font-size:11px;color:var(--sub);font-weight:600;margin:12px 0 7px}
  .themes{display:flex;gap:8px;flex-wrap:wrap}
  .th{width:52px;height:34px;border-radius:8px;border:2px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
  .th.on{border-color:var(--accent)}
  .scenes{margin-top:6px}
  .sc{border:1px solid var(--line);border-radius:9px;padding:8px 11px;margin-bottom:7px;font-size:12.5px;cursor:pointer;background:#fff}
  .sc.cur{border-color:var(--accent);background:rgba(201,120,78,.06)}
  .sc .k{font-weight:700}.sc .p{color:var(--sub);margin-top:3px;line-height:1.5}
  .sc .n{font-size:10.5px;color:var(--accent);float:right}
  .aud{margin-top:16px;padding:12px 13px;border:1px dashed var(--line);border-radius:11px;background:rgba(0,0,0,.02)}
  .aud .t{font-size:12.5px;font-weight:700}.aud .d{font-size:11.5px;color:var(--sub);margin:4px 0 9px;line-height:1.5}
  .empty{color:var(--sub);font-size:13px;padding:30px 10px;text-align:center}
</style></head>
<body>
<div class="wrap">
  <div class="stagebox" id="stagebox">
    <div class="progress" id="prog"></div>
    <div class="stage" id="stage">
      <div class="empty" id="empty">分镜生成后在这里竖版播放…</div>
    </div>
  </div>
  <div class="panel">
    <h2>竖版分镜播放器 <span style="font-size:11px;color:var(--sub);font-weight:400">· 9:16 预览</span></h2>
    <div class="hint">先看节奏／字幕对不对——这是<b>预览</b>，不渲染 MP4、不配音。满意后下载分镜稿，拿去剪映加配音/BGM/节奏收尾。</div>
    <div class="ctl">
      <button class="btn pri" id="play">▶ 播放</button>
      <button class="btn" id="replay">↻ 重播</button>
      <button class="btn" id="dl">⬇ 下载分镜稿</button>
    </div>
    <div class="lbl">视觉主题</div>
    <div class="themes" id="themes"></div>
    <div class="lbl">分镜（<span id="scount">0</span>）· 点跳转</div>
    <div class="scenes" id="scenes"></div>
    <div class="aud">
      <div class="t">🎙 加配音（单独一步 · edge-tts 免费）</div>
      <div class="d">预览不配音、不花钱；配音是<b>你主动点</b>的独立一步，走 edge-tts 免费出音（微软云端）。确定分镜没问题了再配。</div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px">
        <select id="voice" class="btn" style="padding:7px 10px"></select>
        <button class="btn" id="sample">▶ 试听一句</button>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button class="btn pri" id="tts">🎙 给整支配音</button>
        <button class="btn" id="mute" style="display:none">🔊 有声</button>
        <span id="tstat" style="font-size:11.5px;color:var(--sub)"></span>
      </div>
    </div>
  </div>
</div>
<script>
  // ADR-046 P3 用户选定 4 版；sw=选色器底色，fg=选色器字色，short=选色器短标，label=全名
  const THEMES = {
    warm:{label:'暖刊', short:'暖', sw:'#f2ece0', fg:'#c1633a'},
    neon:{label:'午夜霓虹', short:'夜', sw:'#141833', fg:'#8ea2ff'},
    aesop:{label:'Aesop 药房', short:'A', sw:'#E7E2D8', fg:'#5A6247'},
    brut:{label:'新粗野', short:'野', sw:'#FFFDF5', fg:'#0A0A0A'},
  };
  let STORY = { title:'', scenes:[] };
  let theme = 'warm';
  // 播放时钟
  let steps = [];      // 扁平化：每条字幕一格 {si, keyword, sub, kind, phrase, at, end}
  let total = 0, t = 0, playing = false, raf = null, lastTs = 0;
  // 配音（P2b）：每镜一段 audio，rAF 时钟为主、进镜时触发该镜音频
  const VOICES = [
    ['zh-CN-YunxiNeural','云希（男·青年）'],['zh-CN-XiaoxiaoNeural','晓晓（女·温暖）'],
    ['zh-CN-YunyangNeural','云扬（男·播报）'],['zh-CN-XiaoyiNeural','晓伊（女·活泼）'],
  ];
  let audioMap = {}, muted = false, curSceneId = null, sampleAudio = null;

  const $ = id => document.getElementById(id);
  function applyTheme(k){
    if(!THEMES[k]) k='warm';
    theme = k;
    $('stage').className = 'stage th-'+k;   // 皮肤靠 class 覆写（innerHTML 不动 class，持久）
    $('stagebox').style.background = THEMES[k].sw;
    [...document.querySelectorAll('.th')].forEach(el=>el.classList.toggle('on', el.dataset.k===k));
  }
  function renderThemes(){
    $('themes').innerHTML = '';
    Object.entries(THEMES).forEach(([k,c])=>{
      const d = document.createElement('div');
      d.className = 'th'+(k===theme?' on':''); d.dataset.k=k; d.title=c.label;
      d.style.background=c.sw; d.style.color=c.fg; d.textContent=c.short;
      d.onclick=()=>applyTheme(k);
      $('themes').appendChild(d);
    });
  }
  function buildSteps(){
    steps = []; let at = 0;
    STORY.scenes.forEach((sc, si)=>{
      const ph = sc.phrases.length?sc.phrases:[''];
      const per = (sc.dur||ph.length*2)/ph.length;
      ph.forEach(p=>{ steps.push({si, keyword:sc.keyword, sub:sc.sub, kind:sc.kind, phrase:p, at, end:at+per}); at += per; });
    });
    total = at || 0.1;
  }
  function highlightKw(kw){
    // 简易高亮：整个关键词着色（已由 CSS .kw 控制），保留换行
    return (kw||'').replace(/</g,'&lt;');
  }
  let lastStepKey = null;
  function renderAt(time){
    let idx = steps.findIndex(s=> time>=s.at && time<s.end);
    if(idx<0) idx = steps.length-1;
    const step = steps[idx];
    if(!step){ return; }
    $('prog').style.width = Math.min(100, time/total*100)+'%';
    if(idx===lastStepKey) return;   // 同一格不重建 DOM——否则 fade-in 动画每帧重启，字永远停在透明
    lastStepKey = idx;
    const sc = STORY.scenes[step.si];
    const kicker = STORY.title ? `<div class="kicker rv-in">${(STORY.title).replace(/</g,'&lt;')}</div>` : '';
    const sub = step.sub ? `<div class="sub rv-in">${step.sub.replace(/</g,'&lt;')}</div>` : '';
    $('stage').innerHTML =
      `<div class="badge">镜 ${step.si+1}/${STORY.scenes.length}</div>`+
      kicker+
      `<div class="kw rv-in" style="font-size:${step.keyword.length>6?6.4:8.4}vh">${highlightKw(step.keyword)}</div>`+
      sub+
      `<div class="captrack"><div class="capline rv-in">${(step.phrase||'').replace(/</g,'&lt;')}</div></div>`+
      `<div class="brand">杰西卡聊AI</div>`;
    [...document.querySelectorAll('#scenes .sc')].forEach((el,i)=>el.classList.toggle('cur', i===step.si));
    // 进入新镜 → 触发该镜配音（若已配、未静音、正在播）
    const sid = STORY.scenes[step.si] && STORY.scenes[step.si].id;
    if(sid!==curSceneId){ curSceneId=sid; if(playing) playSceneAudio(sid); }
  }
  function stopAllAudio(){ Object.values(audioMap).forEach(a=>{ try{a.pause();a.currentTime=0;}catch(_){}}); }
  function playSceneAudio(sid){ if(muted) return; const a=audioMap[sid]; if(!a) return; Object.entries(audioMap).forEach(([k,el])=>{ if(k!==sid){try{el.pause();el.currentTime=0;}catch(_){}} }); try{a.currentTime=0; a.play().catch(()=>{});}catch(_){} }
  function tick(ts){
    if(!playing){ return; }
    if(!lastTs) lastTs = ts;
    t += (ts-lastTs)/1000; lastTs = ts;
    if(t>=total){ t=total; renderAt(t); stop(); return; }
    renderAt(t);
    raf = requestAnimationFrame(tick);
  }
  function play(){ if(!steps.length) return; if(t>=total){ t=0; curSceneId=null; } playing=true; lastTs=0; $('play').textContent='⏸ 暂停';
    if(!muted && curSceneId && audioMap[curSceneId]){ try{audioMap[curSceneId].play().catch(()=>{});}catch(_){} } raf=requestAnimationFrame(tick); }
  function pause(){ playing=false; if(raf) cancelAnimationFrame(raf); $('play').textContent='▶ 播放'; if(curSceneId&&audioMap[curSceneId]){try{audioMap[curSceneId].pause();}catch(_){}} }
  function stop(){ playing=false; if(raf) cancelAnimationFrame(raf); $('play').textContent='▶ 播放'; }
  function toggle(){ playing?pause():play(); }
  function seekScene(si){ const st=steps.find(s=>s.si===si); if(st){ stopAllAudio(); t=st.at; curSceneId=null; lastStepKey=null; renderAt(t); if(playing) playSceneAudio(STORY.scenes[si]&&STORY.scenes[si].id); } }

  function renderSceneList(){
    $('scount').textContent = STORY.scenes.length;
    $('scenes').innerHTML = STORY.scenes.map((sc,i)=>
      `<div class="sc" data-i="${i}"><span class="n">${(sc.dur||0).toFixed(1)}s · ${sc.kind||''}</span>`+
      `<div class="k">${(sc.keyword||'').replace(/</g,'&lt;')}</div>`+
      `<div class="p">${sc.phrases.map(p=>p.replace(/</g,'&lt;')).join(' / ')}</div></div>`
    ).join('');
    [...document.querySelectorAll('#scenes .sc')].forEach(el=>el.onclick=()=>seekScene(+el.dataset.i));
  }
  function download(){
    let txt = (STORY.title?`《${STORY.title}》\n\n`:'');
    STORY.scenes.forEach((sc,i)=>{
      txt += `【镜 ${i+1}·${sc.kind||''}｜${(sc.dur||0).toFixed(1)}s】${sc.keyword||''}${sc.sub?(' — '+sc.sub):''}\n`;
      sc.phrases.forEach(p=> txt += '  口播：'+p+'\n');
      txt += '\n';
    });
    txt += '—— 竖版分镜稿（工作台预览生成）· 拿去剪映加配音/BGM/字幕收尾\n';
    const blob = new Blob([txt], {type:'text/plain;charset=utf-8'});
    const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download = `分镜稿-${(STORY.title||'video').slice(0,12)}.txt`; a.click(); URL.revokeObjectURL(a.href);
  }
  function load(data){
    STORY = { title:data.title||'', scenes:(data.scenes||[]).map(s=>({id:s.id||'',keyword:s.keyword||'',sub:s.sub||'',phrases:(s.phrases||[]).map(String),kind:s.kind||'',dur:s.dur||0})) };
    if(data.theme && THEMES[data.theme]) theme = data.theme;
    // 新分镜稿 → 旧配音作废
    stopAllAudio(); audioMap={}; curSceneId=null; $('mute').style.display='none'; $('tstat').textContent='';
    $('tts').disabled=false; $('tts').textContent='🎙 给整支配音';
    buildSteps(); renderThemes(); applyTheme(theme); renderSceneList();
    t=0; lastStepKey=null; if(steps.length){ renderAt(0); setTimeout(play, 250); } else { $('stage').innerHTML='<div class="empty">没有分镜</div>'; }
  }
  // 配音到达 → 每镜挂音频、时长改成真实音频长、重建时间轴、带声重播
  function applyAudio(scenes){
    let n=0;
    (scenes||[]).forEach(r=>{
      const sc = STORY.scenes.find(s=>s.id===r.id);
      if(sc && r.audio){ sc.dur = (r.dur||sc.dur)+0.5; audioMap[r.id]=new Audio(r.audio); n++; }
    });
    if(!n){ $('tstat').textContent='配音没成功（可能网络受限）'; $('tts').disabled=false; $('tts').textContent='🎙 重试配音'; return; }
    buildSteps(); renderSceneList();
    $('mute').style.display=''; muted=false; $('mute').textContent='🔊 有声';
    $('tstat').textContent=`已配音 ${n} 镜 · 带声重播中`;
    $('tts').disabled=false; $('tts').textContent='🎙 重新配音';
    t=0; curSceneId=null; lastStepKey=null; renderAt(0); setTimeout(play, 200);
  }
  function fillVoices(){ $('voice').innerHTML = VOICES.map(([k,l])=>`<option value="${k}">${l}</option>`).join(''); }
  $('play').onclick=toggle; $('replay').onclick=()=>{ t=0; curSceneId=null; play(); }; $('dl').onclick=download;
  $('mute').onclick=()=>{ muted=!muted; $('mute').textContent=muted?'🔇 静音':'🔊 有声'; if(muted) stopAllAudio(); else if(playing&&curSceneId) playSceneAudio(curSceneId); };
  $('sample').onclick=()=>{ $('tstat').textContent='试听生成中…'; try{ window.parent.postMessage({type:'kw-tts-sample', voice:$('voice').value}, '*'); }catch(_){} };
  $('tts').onclick=()=>{ if(!STORY.scenes.length){ $('tstat').textContent='先有分镜'; return; } $('tts').disabled=true; $('tts').textContent='配音生成中…'; $('tstat').textContent='每镜约 1–2 秒，稍等…'; try{ window.parent.postMessage({type:'kw-tts-request', voice:$('voice').value}, '*'); }catch(_){} };
  fillVoices(); renderThemes(); applyTheme('warm');
  window.addEventListener('message',(e)=>{
    const d = e.data; if(!d) return;
    if(d.type==='kw-storyboard' && Array.isArray(d.scenes)) load(d);
    else if(d.type==='kw-tts' && Array.isArray(d.scenes)) applyAudio(d.scenes);
    else if(d.type==='kw-tts-error'){ $('tstat').textContent='配音失败：'+(d.error||''); $('tts').disabled=false; $('tts').textContent='🎙 重试配音'; }
    else if(d.type==='kw-tts-sample-audio' && d.audio){ try{ if(sampleAudio) sampleAudio.pause(); sampleAudio=new Audio(d.audio); sampleAudio.play().catch(()=>{}); $('tstat').textContent='▶ 试听中'; }catch(_){} }
    else if(d.type==='kw-tts-sample-error'){ $('tstat').textContent='试听失败：'+(d.error||''); }
  });
  try{ if(window.parent!==window) window.parent.postMessage({type:'kw-player-ready'},'*'); }catch(_){}
</script>
</body></html>
